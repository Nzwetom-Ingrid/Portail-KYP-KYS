<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plateforme d'onboarding KYP / KYS — Connaissance partenaire et fournisseur." />

    <!-- Polices : pro, raffiné, soft & moderne -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..600&family=Sora:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>KYP / KYS · Mon espace</title>

    <!-- Identité du tiers connecté, injectée par Power Pages via Liquid
         (rendu côté serveur quand l'utilisateur est authentifié). Garde
         défensive : si le Liquid n'est pas rendu (dev local, ou page servie
         en statique), les valeurs commencent par « { » et sont ignorées —
         le portail retombe alors sur ses autres voies de résolution. -->
    <script>
      (function () {
        var u = {
          id: "{{ user.id }}",
          firstName: "{{ user.firstname }}",
          lastName: "{{ user.lastname }}",
          fullName: "{{ user.fullname }}",
          email: "{{ user.emailaddress1 }}"
        };
        if (u.id && u.id.charAt(0) !== "{") {
          u.contactId = u.id;
          window.User = u;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
